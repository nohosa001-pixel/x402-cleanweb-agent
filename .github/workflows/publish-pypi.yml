name: Publish to PyPI

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'README.md'
      - 'app/**'
      - 'mcp_server.py'
      - '.github/workflows/publish-pypi.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine requests

      - name: Build package
        run: python -m build

      - name: Verify package
        run: twine check dist/*

      - name: Publish package to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN || secrets.TWINE_PASSWORD }}
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Checking if x402-cleanweb-agent==$PKG_VERSION is already published on PyPI..."

          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/x402-cleanweb-agent/${PKG_VERSION}/json")
          if [ "$STATUS_CODE" = "200" ]; then
            echo "::notice ::x402-cleanweb-agent==$PKG_VERSION is already published on PyPI. Skipping upload."
            exit 0
          fi

          if [ -n "$TWINE_PASSWORD" ]; then
            echo "Uploading x402-cleanweb-agent==$PKG_VERSION to PyPI via Twine token..."
            twine upload --skip-existing dist/*
          else
            echo "::notice ::PYPI_API_TOKEN not set in GitHub Actions secrets; package verified and ready for local Twine upload."
          fi
