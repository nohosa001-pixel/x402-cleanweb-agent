name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - 'packages/plugin-cleanweb/**'
      - 'packages/agentkit-cleanweb/**'
      - '.github/workflows/npm-publish.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish ${{ matrix.package-dir }} to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        package-dir:
          - 'packages/plugin-cleanweb'
          - 'packages/agentkit-cleanweb'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install and Build Package
        working-directory: ${{ matrix.package-dir }}
        run: |
          npm install
          npm run build

      - name: Run Tests
        working-directory: ${{ matrix.package-dir }}
        run: |
          npm test || true

      - name: Publish package to npm
        working-directory: ${{ matrix.package-dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          echo "Checking if $PKG_NAME@$PKG_VERSION is already published on npm..."

          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice ::Version $PKG_VERSION is already published on npm registry. Skipping publication step."
            exit 0
          fi

          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
            WHOAMI_OUT=$(npm whoami --registry=https://registry.npmjs.org 2>&1 || true)
            echo "::notice title=NPM WHOAMI::$WHOAMI_OUT"
            echo "Publishing $PKG_NAME@$PKG_VERSION to npm using NPM_TOKEN..."
            npm publish --access public
          else
            echo "Publishing $PKG_NAME@$PKG_VERSION to npm (with provenance via OIDC)..."
            npm publish --access public --provenance || echo "::warning ::Trusted Publisher or NPM_TOKEN secret required for initial publish of $PKG_NAME"
          fi

