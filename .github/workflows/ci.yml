name: Thin Client CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Thin Client Pytest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONPATH: .
      X402_THIN_CLIENT_MODE: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Thin Client dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Verify zero app/ server code and run Thin Client tests
        run: |
          test ! -d app
          pytest tests/test_v3_thin_client_build.py -v --tb=short
