services:
  - type: web
    name: polygon-x402-cleanweb-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: POLYGON_RPC_URL
        value: https://polygon-bor-rpc.publicnode.com
      - key: USDC_CONTRACT_ADDRESS
        value: 0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359
      - key: SERVER_WALLET_ADDRESS
        value: 0x255F9991233f86B29dB847c8d5b8CB9915e80dCf
      - key: PAYMENT_AMOUNT_USDC
        value: "0.01"
