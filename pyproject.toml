[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "x402-cleanweb-agent"
version = "1.2.1"
description = "Web3 x402 Micropayment MCP & AI Agent Tool Suite for LLM Data Extraction on Polygon Mainnet"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "x402 AI Agent Team", email = "developer@x402.agent" }
]
keywords = [
    "ai-agent",
    "x402",
    "mcp",
    "polygon",
    "web3",
    "langchain",
    "crewai",
    "smolagents",
    "micropayments",
    "web-scraper",
    "llm-ready"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "mcp>=1.0.0",
    "web3>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "youtube-transcript-api>=0.6.2",
    "pypdf>=4.0.0",
]

[project.urls]
Homepage = "https://x402-cleanweb-agent-7qxtp3324q-du.a.run.app"
Documentation = "https://x402-cleanweb-agent-7qxtp3324q-du.a.run.app/docs"
Repository = "https://github.com/nohosa001-pixel/x402-cleanweb-agent"
Issues = "https://github.com/nohosa001-pixel/x402-cleanweb-agent/issues"

[project.scripts]
x402-cleanweb-agent = "mcp_server:main"
x402-agent = "mcp_server:main"
x402-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server", "polygon_agent", "autonomous_agent_client", "agent_tools"]



