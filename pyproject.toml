[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "x402-cleanweb-agent"
version = "1.2.0"
description = "Web3 x402 Micropayment MCP Suite for Web, YouTube, PDF Papers & Plain Text on Polygon Mainnet"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "x402 Agent Developer" }
]
dependencies = [
    "mcp>=1.0.0",
    "web3>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "youtube-transcript-api>=0.6.2",
    "pypdf>=4.0.0",
]

[project.scripts]
x402-agent = "mcp_server:main"
x402-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server", "polygon_agent"]
