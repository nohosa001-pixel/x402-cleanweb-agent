steps:
  # 1. Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/x402-cleanweb-agent:$BUILD_ID', '-t', 'gcr.io/$PROJECT_ID/x402-cleanweb-agent:latest', '.']

  # 2. Container Registry / Artifact Registry로 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/x402-cleanweb-agent:latest']

  # 3. Cloud Run 배포
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'x402-cleanweb-agent'
      - '--image'
      - 'gcr.io/$PROJECT_ID/x402-cleanweb-agent:latest'
      - '--region'
      - 'asia-northeast3'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/x402-cleanweb-agent:latest'
  - 'gcr.io/$PROJECT_ID/x402-cleanweb-agent:$BUILD_ID'
